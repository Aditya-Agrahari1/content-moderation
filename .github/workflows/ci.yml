name: ci
on: [push, pull_request]

jobs:
  api-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.11"
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run pytest tests/unit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build --wait db redis provider api
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d worker
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml exec -T api pytest
