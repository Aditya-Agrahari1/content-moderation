# Overrides for tests, the workload and the crash test: short timeouts so failures show up fast,
# and the scripts/evidence folders mounted into the api container.
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
x-test-env: &test-env
  PROVIDER_CONNECT_TIMEOUT_S: "1"
  PROVIDER_READ_TIMEOUT_S: "3"
  WORKER_POLL_INTERVAL_S: "0.5"
  MAX_CONCURRENT_PER_WORKSPACE: "2"
  LEASE_DURATION_S: "6"
  LEASE_HEARTBEAT_S: "1"
  BACKOFF_BASE_S: "0.2"
  BACKOFF_CAP_S: "1"
  RETRY_AFTER_DEFAULT_S: "1"
  RETRY_AFTER_MAX_S: "5"
  CB_FAILURE_THRESHOLD: "3"
  CB_COOLDOWN_S: "2"
  CB_COOLDOWN_MAX_S: "8"
  HELD_PROVIDER_MIN_WAIT_S: "3"
  CALLBACK_DEADLINE_S: "8"
  SWEEP_INTERVAL_S: "0.5"

services:
  provider:
    environment:
      PROVIDER_HANG_S: "30"
      CALLBACK_DELAY_MS: "200"
  api:
    environment:
      <<: *test-env
    volumes:
      - ./scripts:/app/scripts:ro
      - ./evidence:/app/evidence
  worker:
    environment:
      <<: *test-env
